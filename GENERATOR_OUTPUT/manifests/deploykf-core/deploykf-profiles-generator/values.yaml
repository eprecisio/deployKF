########################################
## SHARED | deploykf-helpers
########################################
deployKF_helpers:
  deploykf_profiles:
    users_id_mapping: {"user-1":{"email":"user1@stack8s.com","id":"user-1"},"user-2":{"email":"user2@stack8s.com","id":"user-2"},"user-3":{"email":"user3@stack8s.com","id":"user-3"}}
    profiles_users_access_mapping: {"ukdri-team1-dev":{"user-1":{"notebooksAccess":true,"role":"edit"},"user-3":{"notebooksAccess":true,"role":"edit"}},"ukdri-team1-prod":{"user-3":{"notebooksAccess":true,"role":"edit"}},"ukdri-team1-prod-temp":{"user-3":{"notebooksAccess":true,"role":"edit"}}}
    users_profiles_access_mapping: {"user-1":{"ukdri-team1-dev":{"notebooksAccess":true,"role":"edit"}},"user-3":{"ukdri-team1-dev":{"notebooksAccess":true,"role":"edit"},"ukdri-team1-prod":{"notebooksAccess":true,"role":"edit"},"ukdri-team1-prod-temp":{"notebooksAccess":true,"role":"edit"}}}

  kubeflow:
    pipelines:
      object_store:
        profile:
          cloned_secret_name: "cloned--pipelines-object-store-auth"

########################################
## SHARED | deploykf
########################################
deployKF:
  extraManifests:

  clusterDomain: cluster.local

  argoWorkflows:
    enabled: true
    namespace: "kubeflow-argo-workflows"

  kubeflow:
    useridHeader: kubeflow-userid

    pipelines:
      enabled: true
      pipelineUI:
        namespace: kubeflow
        serviceAccount: ml-pipeline-ui

  gateway:
    namespace: "istio-ingress"
    serviceAccount: "istio-ingress"
    emailToLowercase: false


########################################
## CONFIGS | profiles
########################################

## profile defaults
##
profileDefaults:

  ## a common prefix to add to all profile names
  ##
  profileNamePrefix: ""

  ## the default email to set as the owner of profiles
  ##
  ownerEmail: "admin@stack8s.com"

  ## the default access for members of profiles, when not explicitly specified
  ##
  memberAccess:

    ## the Kubernetes RBAC role to bind to users in the profile namespace
    ##  - "edit": binds "ClusterRole/kubeflow-edit" (can view/create/delete resources)
    ##  - "view": binds "ClusterRole/kubeflow-view" (cam view resources)
    ##
    role: "view"

    ## if the user can ~connect~ to kubeflow notebooks in the profile
    ##
    notebooksAccess: false

  ## the default list of plugins for profiles, when not explicitly specified
  ##
  plugins: []

  ## the default resource quota for profiles, when not explicitly specified
  ##  - spec for ResourceQuotaSpec:
  ##    https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.25/#resourcequotaspec-v1-core
  ##
  resourceQuotaSpec: {}

## user entities
##  - a list of users that can be referenced when defining profile members
##
users: [{"email":"user1@stack8s.com","id":"user-1"},{"email":"user2@stack8s.com","id":"user-2"},{"email":"user3@stack8s.com","id":"user-3"}]

## group entities
##  - a list of groups that can be referenced when defining profile members
##
groups: [{"id":"team-1","users":["user-1","user-3"]},{"id":"team-2","users":["user-3"]},{"id":"team-2-temp","users":["user-3"]}]

## profile definitions
##  - a list of profile definitions to be generated
##
profiles: [{"members":[{"access":{"notebooksAccess":true,"role":"edit"},"group":"team-1"}],"name":"ukdri-team1-dev"},{"members":[{"access":{"notebooksAccess":true,"role":"edit"},"group":"team-2"}],"name":"ukdri-team1-prod"},{"members":[{"access":{"notebooksAccess":true,"role":"edit"},"group":"team-2-temp"}],"name":"ukdri-team1-prod-temp"}]
